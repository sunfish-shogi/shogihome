usi:
  name: USI Replay Engine
  path: usi-replay-engine
  options:
    USI_Hash:
      type: spin
      value: 32
    USI_Ponder:
      type: check
      value: false
    BookFile:
      type: string
      value: standard_book.db
    EvalDir:
      type: filename
      value: eval
    BookMoveSelector:
      type: combo
      value: default
    ClearHash:
      type: button
  enableEarlyPonder: false
server:
  protocolVersion: v121_floodgate
  host: 127.0.0.1
  port: 4081
  id: usi-csa-bridge
  password: test
  tcpKeepalive:
    initialDelay: 10
  blankLinePing:
    initialDelay: 30
    interval: 30
saveRecordFile: true
enableComment: true
recordFileNameTemplate: "usi-csa-bridge-{_title}{_sente}{_gote}"
recordFileFormat: .kifu
repeat: 1
autoRelogin: true
restartPlayerEveryGame: false
