name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            os_short: win
            variant: installer
          - os: windows
            os_short: win
            variant: portable
          - os: macos
            os_short: mac
            variant: installer
          - os: ubuntu
            os_short: linux
            variant: installer
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: git config --global core.autocrlf false
        if: matrix.os == 'windows'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm version
      - run: npm ci --no-audit --no-fund --prefer-online
      - run: npm run electron:build
        if: matrix.variant != 'portable'
      - run: npm run electron:portable
        if: matrix.variant == 'portable'
      - run: node scripts/archive.mjs ${{ matrix.os_short }} ${{ github.ref_name }} ${{ matrix.variant }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}${{ matrix.variant == 'portable' && '-portable' || '' }}-release
          path: dist/release-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The checkout only provides the repository context that "gh" resolves from the
      # remote URL. "gh release create" authenticates with GH_TOKEN, not with the
      # credentials checkout would otherwise leave in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          gh release create "$TAG_NAME" \
            --title "ShogiHome $TAG_NAME" \
            --draft \
            dist/release-*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
