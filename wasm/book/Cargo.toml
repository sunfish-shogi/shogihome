[package]
name = "shogihome-book"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Book (opening database) storage for ShogiHome, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
